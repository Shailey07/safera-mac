name: Build Mac App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod tidy

      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build Mac App
        run: |
          export CGO_ENABLED=1
          fyne package -os darwin -icon resources/seb-logo.png -name SafeEra -app-id com.safera.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeEra-Mac
          path: SafeEra.app
